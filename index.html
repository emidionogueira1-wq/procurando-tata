.ph{width:46px;height:80px;border:4px solid #ffd34d;border-radius:10px;animation:rotp 1.8s ease-in-out infinite}
@keyframes rotp{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.ph{animation:none;transform:rotate(-90deg)}}

function pollPad(){let ps=[];try{ps=navigator.getGamepads?navigator.getGamepads():[]}catch(e){}const s={};for(const g of ps){if(!g)continue;const ax=g.axes[0]||0,ay=g.axes[1]||0,b=i=>g.buttons[i]&&g.buttons[i].pressed;if(ax<-.4||b(14))s.l=1;if(ax>.4||b(15))s.r=1;if(ay<-.5||b(12))s.u=1;if(ay>.5||b(13))s.d=1;if(b(0)||b(1)||b(2)||b(7))s.j=1;if(b(9))s.p=1;if(b(3)||b(8))s.m=1;const rx=g.axes[2]||0,ry=g.axes[3]||0;if(rx<-.5)s.l=1;if(rx>.5)s.r=1;if(ry<-.5)s.u=1;if(ry>.5)s.d=1;}for(const k in s)if(!GP[k]){P[k]=true;lastIn='pad'}GP=s;}

let AC=null,mute=false;

function snd(f,d,type,v,f2,delay){if(!AC||mute)return;try{const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.05,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
